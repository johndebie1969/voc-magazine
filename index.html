<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOC Amsterdam — Magazine Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --groen-900: #0A2E0F; --groen-800: #0F3D15; --groen-700: #165220;
      --groen-600: #1A6426; --groen-500: #21822F; --groen-400: #2FA040;
      --groen-300: #5DC46E; --groen-200: #A0DBA8; --groen-100: #D4EDDA;
      --groen-50: #EEF7EF; --wit: #FFFFFF; --wit-warm: #F8FAF8;
      --gray-100: #F0F2F0; --gray-200: #D8DDD8; --gray-400: #8A958A;
      --gray-600: #525D52; --text: #131A13;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); color: var(--text); min-height: 100vh; }
    .header {
      background: linear-gradient(160deg, var(--groen-900) 0%, var(--groen-700) 100%);
      padding: 2.5rem 1.5rem 2.5rem;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
    }
    .logo-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.3); margin: 0 auto 1rem; display: block; background: white; }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--wit); margin-bottom: 4px; }
    .header p { font-size: 13px; color: var(--groen-200); }
    .header-tag { display: inline-block; margin-top: 12px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); font-size: 12px; padding: 4px 14px; border-radius: 20px; }
    .main { max-width: 680px; margin: 0 auto; padding: 2rem 1.25rem; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray-400); margin-bottom: 0.75rem; margin-top: 1.5rem; }
    .section-label:first-child { margin-top: 0; }
    .kaart { background: var(--wit); border: 1px solid var(--gray-200); border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 10px; display: flex; align-items: center; gap: 1rem; text-decoration: none; color: var(--text); transition: all 0.2s; position: relative; overflow: hidden; }
    .kaart::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--gray-200); transition: background 0.2s; }
    .kaart:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); border-color: var(--groen-300); }
    .kaart:hover::before { background: var(--groen-500); }
    .kaart-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .kaart-icon.groen { background: var(--groen-50); }
    .kaart-icon.licht { background: #F0F7F0; }
    .kaart-titel { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .kaart-sub { font-size: 12px; color: var(--gray-600); line-height: 1.4; }
    .kaart-pijl { margin-left: auto; font-size: 18px; color: var(--gray-400); flex-shrink: 0; }
    .divider { height: 1px; background: var(--gray-200); margin: 0.5rem 0; }
    .footer { text-align: center; padding: 2rem 1rem; font-size: 11px; color: var(--gray-400); line-height: 1.8; }
  </style>
</head>
